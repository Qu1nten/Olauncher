name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every build is signed with the same key, so a new APK installs over the launcher already on
      # the phone. It comes from a repository secret: GitHub's cache lost it, which forced a reinstall.
      - name: Signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the signing key as the DEBUG_KEYSTORE_BASE64 repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "OLAUNCHER_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk olauncher-widgets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: olauncher-widgets-debug
          path: olauncher-widgets.apk

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Olauncher with widgets (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Built from ${{ github.sha }}.
            Install olauncher-widgets.apk below. Newer builds install over older ones.
          files: olauncher-widgets.apk
