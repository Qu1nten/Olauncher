name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      new_signing_key:
        description: Sign with a new key if the stored one is gone (installed copies must then be reinstalled)
        type: boolean
        default: false

permissions:
  contents: write

env:
  HAS_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign every build with the same key so new APKs install over old ones.
      # A DEBUG_KEYSTORE_BASE64 repository secret wins; otherwise the key is kept in the Actions cache.
      - name: Restore signing key from secret
        if: env.HAS_KEYSTORE_SECRET == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Restore signing key from cache
        id: keystore-cache
        if: env.HAS_KEYSTORE_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore

      # Without the stored key the build would be signed with a new one, and Android refuses to
      # install that over the launcher already on the phone, so stop instead of publishing it
      - name: Stop if the signing key is missing
        if: env.HAS_KEYSTORE_SECRET != 'true' && steps.keystore-cache.outputs.cache-hit != 'true' && inputs.new_signing_key != true
        run: |
          echo "::error::The signing key is gone from the Actions cache. Add it as the DEBUG_KEYSTORE_BASE64 secret, or run this workflow by hand with 'new_signing_key' ticked (installed copies must then be reinstalled)."
          exit 1

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk olauncher-widgets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: olauncher-widgets-debug
          path: olauncher-widgets.apk

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Olauncher with widgets (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Built from ${{ github.sha }}.
            Install olauncher-widgets.apk below. Newer builds install over older ones.
          files: olauncher-widgets.apk
