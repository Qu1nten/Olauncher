name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every build is signed with the same key, so a new APK installs over the launcher already on
      # the phone. The DEBUG_KEYSTORE_BASE64 secret is used when set; otherwise the key is created once
      # and kept in the Actions cache, which the weekly "Keep signing key" job stops from expiring.
      - name: Restore signing key from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/olauncher-signing
          key: olauncher-signing-key

      - name: Signing key
        id: signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          CACHED: ${{ steps.keystore-cache.outputs.cache-hit }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/debug.keystore"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          else
            keystore="$HOME/olauncher-signing/debug.keystore"
            if [ "$CACHED" != "true" ]; then
              mkdir -p "$HOME/olauncher-signing"
              keytool -genkeypair -keystore "$keystore" -storepass android -alias androiddebugkey \
                -keypass android -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Android Debug,O=Android,C=US"
              echo "new_key=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "OLAUNCHER_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk olauncher-widgets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: olauncher-widgets-debug
          path: olauncher-widgets.apk

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Olauncher with widgets (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ steps.signing.outputs.new_key == 'true' && '**Signed with a new key: uninstall the launcher before installing this build.** Builds after it install over it again.' || '' }}

            Built from ${{ github.sha }}.
            Install olauncher-widgets.apk below. Newer builds install over older ones.
          files: olauncher-widgets.apk
