name: Keep signing key

# GitHub deletes cached files that go unused for 7 days. The APK's signing key lives in the cache,
# and a build with a different key can't update the launcher on the phone, so use it every week.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - name: Restore signing key from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore
          fail-on-cache-miss: true
